<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sport Challenge · Des défis sportifs entre amis</title>
    <!-- For link previews, which do not run the app: the landing page's text
         (landing.metaDescription), which the app sets in the active language. -->
    <meta
      name="description"
      content="Crée un défi sportif de quelques semaines, invite tes amis et saisis tes séances : tous les sports comptent, et chaque catégorie a son podium. Gratuit."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sport Challenge · Des défis sportifs entre amis" />
    <meta
      property="og:description"
      content="Crée un défi sportif de quelques semaines, invite tes amis et saisis tes séances : tous les sports comptent, et chaque catégorie a son podium. Gratuit."
    />
    <!-- Installable app: public/manifest.webmanifest, icons and public/sw.js. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Page background (--color-bg) in each theme. -->
    <meta name="theme-color" content="#F5F4F0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1115" media="(prefers-color-scheme: dark)" />
    <script>
      // Theme before the first paint (same rules and key as src/lib/theme.ts).
      (function () {
        var choice;
        try {
          choice = localStorage.getItem('sport-challenge:theme');
        } catch (e) {}
        var dark =
          choice === 'dark' ||
          (choice !== 'light' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
